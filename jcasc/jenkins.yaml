jenkins:
  systemMessage: "Jenkins Lab · managed by JCasC"
  numExecutors: 2
  mode: NORMAL
  labelString: "built-in"
  crumbIssuer: "standard"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8090/"
    adminAddress: "admin@jenkins.lab"
