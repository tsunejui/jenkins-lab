jenkins:
  systemMessage: "Jenkins Lab · managed by JCasC"
  numExecutors: 2
  mode: NORMAL
  labelString: "built-in"
  crumbIssuer: "standard"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "demo-api-token"
              secret: "${DEMO_API_TOKEN:-lab-api-token-change-me}"
              description: "Demo string secret consumed by secret-demo.Jenkinsfile"
          - usernamePassword:
              scope: GLOBAL
              id: "demo-basic-auth"
              username: "${DEMO_USER_ID:-demo}"
              password: "${DEMO_USER_PASSWORD:-demo-password}"
              description: "Demo username/password consumed by secret-demo.Jenkinsfile"

unclassified:
  location:
    url: "http://localhost:8090/"
    adminAddress: "admin@jenkins.lab"

jobs:
  - script: |
      pipelineJob('jcasc-demo') {
        description('Pipeline defined inline in jcasc/jenkins.yaml (Job DSL)')
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                  agent any
                  stages {
                      stage('Hello from JCasC') {
                          steps {
                              echo 'This pipeline was created by Job DSL embedded in JCasC.'
                          }
                      }
                      stage('Env') {
                          steps {
                              sh 'echo "Build #${BUILD_NUMBER} on ${NODE_NAME}"'
                          }
                      }
                  }
              }
            '''.stripIndent())
          }
        }
      }
