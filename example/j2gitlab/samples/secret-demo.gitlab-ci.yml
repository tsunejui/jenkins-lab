# Configure these as protected CI/CD variables in GitLab:
#   Settings → CI/CD → Variables
variables:
  API_TOKEN: "${API_TOKEN}"   # was Jenkins credentialsId 'demo-api-token'
  DEMO_USER: "${DEMO_USER}"   # was Jenkins credentialsId 'demo-basic-auth'
  DEMO_PASS: "${DEMO_PASS}"   # was Jenkins credentialsId 'demo-basic-auth'
  TOKEN: "${TOKEN}"   # was Jenkins credentialsId 'demo-api-token'

stages:
  - "String secret"
  - "Username + password"
  - "Leak test"

"String secret":
  stage: "String secret"
  script:
    - |
      echo "API_TOKEN length : ${#API_TOKEN}"
      echo "Raw value in log : $API_TOKEN"   # printed as ****
      curl -sS --max-time 3 \
           -H "Authorization: Bearer $API_TOKEN" \
           https://httpbin.org/bearer || true
      

"Username + password":
  stage: "Username + password"
  script:
    - |
      echo "Username        : $DEMO_USER"
      echo "Password length : ${#DEMO_PASS}"
      echo "Raw value in log: $DEMO_PASS"    # printed as ****
      

"Leak test":
  stage: "Leak test"
  script:
    - "printf \"leak attempt: %s\\\\n\" \"$TOKEN\""
