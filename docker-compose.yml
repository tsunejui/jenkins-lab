services:
  jenkins:
    build:
      context: .
    image: jenkins-lab:local
    container_name: jenkins-lab
    restart: unless-stopped
    ports:
      - "8090:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Duser.timezone=Asia/Taipei"
      CASC_JENKINS_CONFIG: /var/jenkins_jcasc/jenkins.yaml
      JENKINS_ADMIN_ID: "${JENKINS_ADMIN_ID:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:-admin}"
      DEMO_API_TOKEN: "${DEMO_API_TOKEN:-lab-api-token-change-me}"
      DEMO_USER_ID: "${DEMO_USER_ID:-demo}"
      DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-demo-password}"
      TZ: Asia/Taipei
    volumes:
      - ./data/jenkins_home:/var/jenkins_home
      - ./jcasc:/var/jenkins_jcasc:ro
      - ./pipelines:/var/jenkins_pipelines:ro
      - ./init.groovy.d:/var/jenkins_home/init.groovy.d:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
