# Multi-image GitLab CI demo.
# Run locally with `gitlab-ci-local`; see README.md for the full recipe.
#
# This pipeline intentionally mixes tooling containers to illustrate the
# patterns most migrations hit: a fallback `default:` image, per-job image
# overrides, cross-stage artifacts, and a DAG via `needs:`.

stages:
  - preflight
  - test
  - build
  - publish
  - deploy

variables:
  APP_NAME: demo-app
  APP_VERSION: "1.0.0"

default:
  # Any job that doesn't declare its own image inherits this one.
  image: alpine:3.20

# ─── preflight ──────────────────────────────────────────────────────────────

preflight:yaml:
  stage: preflight
  # cytopia/yamllint ships with ENTRYPOINT=["yamllint"] so the whole script
  # block would be treated as a config-file path. Clearing the entrypoint
  # lets the runner inject its shell like it does for a plain image.
  image:
    name: cytopia/yamllint:latest
    entrypoint: [""]
  script:
    - |
      yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .gitlab-ci.yml

preflight:env:
  stage: preflight
  # Uses default:image (alpine:3.20).
  script:
    - echo "Using default image — printing relevant env"
    - env | grep -E "^(APP_|CI_JOB_NAME|CI_PIPELINE_ID|CI_PROJECT_DIR)" | sort

# ─── test ───────────────────────────────────────────────────────────────────
# Two independent test jobs run in parallel once preflight passes.

test:python:
  stage: test
  image: python:3.12-alpine
  script:
    - python --version
    - |
      python - <<'PY'
      import os
      assert 2 + 2 == 4
      print(f"Python test ok for {os.environ['APP_NAME']} {os.environ['APP_VERSION']}")
      PY

test:node:
  stage: test
  image: node:20-alpine
  script:
    - node --version
    - |
      node -e '
      console.assert(1 + 1 === 2, "math works");
      console.log(`Node test ok for ${process.env.APP_NAME} ${process.env.APP_VERSION}`);
      '

# ─── build ──────────────────────────────────────────────────────────────────
# Compile a tiny Go binary, save as an artifact so publish can consume it.

build:binary:
  stage: build
  image: golang:1.22-alpine
  script:
    - |
      cat > main.go <<'GO'
      package main

      import (
          "fmt"
          "os"
      )

      func main() {
          fmt.Printf("Hello from %s %s (job %s)\n",
              os.Getenv("APP_NAME"),
              os.Getenv("APP_VERSION"),
              os.Getenv("CI_JOB_NAME"))
      }
      GO
    - go build -o demo-app main.go
    - ./demo-app
  artifacts:
    paths:
      - demo-app
    expire_in: 1 day

# ─── publish ────────────────────────────────────────────────────────────────
# DAG: publish:inspect starts the moment build:binary finishes, rather than
# waiting for the whole build stage.

publish:inspect:
  stage: publish
  image: alpine:3.20
  needs:
    - build:binary
  script:
    - apk add --no-cache file >/dev/null
    - ls -la
    - file demo-app
    - echo "would publish ${APP_NAME} ${APP_VERSION}"

# ─── deploy ─────────────────────────────────────────────────────────────────
# Demonstrates consuming three kinds of CI/CD variables:
#   • string / masked       → DEPLOY_API_TOKEN
#   • username + password   → REGISTRY_USER / REGISTRY_PASSWORD
#   • file-type             → KUBECONFIG (GitLab writes the content to a
#                             temp file and exports the path)
#
# Production: define these under Settings → CI/CD → Variables and mark
# secret-ish ones as masked + protected.
# Locally: test/fixtures/gitlab-pipeline.variables.yml provides dummy
# values — see README.md for the one-line copy command.

deploy:api-auth:
  stage: deploy
  image: alpine:3.20
  needs:
    - publish:inspect
  script:
    - |
      [ -n "${DEPLOY_API_TOKEN:-}" ] || { echo "DEPLOY_API_TOKEN unset"; exit 1; }
      echo "Token length    : ${#DEPLOY_API_TOKEN}"
      echo "Token (prefix)  : ${DEPLOY_API_TOKEN:0:4}****"
      echo "Would POST to https://api.example.com with Bearer token"

deploy:registry-login:
  stage: deploy
  image: alpine:3.20
  needs:
    - publish:inspect
  script:
    - |
      [ -n "${REGISTRY_USER:-}" ]     || { echo "REGISTRY_USER unset"; exit 1; }
      [ -n "${REGISTRY_PASSWORD:-}" ] || { echo "REGISTRY_PASSWORD unset"; exit 1; }
      echo "Registry user     : $REGISTRY_USER"
      echo "Password length   : ${#REGISTRY_PASSWORD}"
      echo "Would run: echo \"\$REGISTRY_PASSWORD\" | docker login -u \"\$REGISTRY_USER\" --password-stdin registry.example.com"

deploy:kubeconfig:
  stage: deploy
  image: alpine:3.20
  needs:
    - publish:inspect
  script:
    - |
      [ -n "${KUBECONFIG_CONTENT:-}" ] || { echo "KUBECONFIG_CONTENT unset"; exit 1; }
      # Common pattern when the secret is delivered as a string — write it
      # to a file inside the job, then point KUBECONFIG at that path so
      # kubectl / helm can use it.
      printf '%s' "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig
      echo "KUBECONFIG path : $KUBECONFIG"
      echo "Lines           : $(wc -l < "$KUBECONFIG")"
      echo "Preview:"
      head -10 "$KUBECONFIG" | sed 's/^/  /'
