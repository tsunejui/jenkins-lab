stages:
  - .pre
  - preflight
  - test
  - build
  - publish
  - .post
variables:
  APP_NAME: demo-app
  APP_VERSION: 1.0.0
default:
  image: alpine:3.20
preflight:yaml:
  stage: preflight
  image:
    name: cytopia/yamllint:latest
  script:
    - >
      yamllint -d "{extends: relaxed, rules: {line-length: disable}}"
      .gitlab-ci.yml
preflight:env:
  stage: preflight
  script:
    - echo "Using default image — printing relevant env"
    - env | grep -E "^(APP_|CI_JOB_NAME|CI_PIPELINE_ID|CI_PROJECT_DIR)" | sort
  image:
    name: alpine:3.20
test:python:
  stage: test
  image:
    name: python:3.12-alpine
  script:
    - python --version
    - >
      python - <<'PY'

      import os

      assert 2 + 2 == 4

      print(f"Python test ok for {os.environ['APP_NAME']}
      {os.environ['APP_VERSION']}")

      PY
test:node:
  stage: test
  image:
    name: node:20-alpine
  script:
    - node --version
    - >
      node -e '

      console.assert(1 + 1 === 2, "math works");

      console.log(`Node test ok for ${process.env.APP_NAME}
      ${process.env.APP_VERSION}`);

      '
build:binary:
  stage: build
  image:
    name: golang:1.22-alpine
  script:
    - |
      cat > main.go <<'GO'
      package main

      import (
          "fmt"
          "os"
      )

      func main() {
          fmt.Printf("Hello from %s %s (job %s)\n",
              os.Getenv("APP_NAME"),
              os.Getenv("APP_VERSION"),
              os.Getenv("CI_JOB_NAME"))
      }
      GO
    - go build -o demo-app main.go
    - ./demo-app
  artifacts:
    paths:
      - demo-app
    expire_in: 1 day
publish:inspect:
  stage: publish
  image:
    name: alpine:3.20
  needs:
    - job: build:binary
      artifacts: true
      optional: false
  script:
    - apk add --no-cache file >/dev/null
    - ls -la
    - file demo-app
    - echo "would publish ${APP_NAME} ${APP_VERSION}"
