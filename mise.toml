[tools]
just                  = "1.46.0"
java                  = "temurin-21.0.10+7.0.LTS"
gum                   = "0.17.0"
jq                    = "1.8.1"
"npm:gitlab-ci-local" = "4.71.0"

[env]
COMPOSE_PROJECT_NAME = "jenkins-lab"
JENKINS_URL = "http://localhost:8090"
JENKINS_ADMIN_ID = "admin"
JENKINS_ADMIN_PASSWORD = "admin"

# Demo credentials consumed by pipelines/secret-demo.Jenkinsfile.
# Override locally via .mise.local.toml for anything realistic.
DEMO_API_TOKEN     = "lab-api-token-change-me"
DEMO_USER_ID       = "demo"
DEMO_USER_PASSWORD = "demo-password"
