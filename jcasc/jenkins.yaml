# ─── Jenkins Configuration as Code ───────────────────────────────────────────
# This file is mounted into the controller at /var/jenkins_jcasc/jenkins.yaml
# (see docker-compose.yml), and CASC_JENKINS_CONFIG env points the JCasC
# plugin at it. It is re-applied on every container boot.
#
# How to apply changes without restarting the container:
#
#   just reload-casc
#     → runs: jenkins-cli apply-configuration
#     → re-reads /var/jenkins_jcasc/jenkins.yaml server-side
#
#   just cli apply-configuration
#     → same thing, direct CLI form
#
#   cat ad-hoc.yaml | just cli apply-configuration
#     → push an arbitrary yaml from stdin instead of the server file
#
#   just cli check-configuration < jcasc/jenkins.yaml
#     → validate syntax + schema without applying (good for PR review)
#
#   just cli export-configuration
#     → dump the live controller state as yaml (values are encrypted)
#
# Full walkthrough: docs/configuration.md
# Sibling flows: docs/jenkins-cli.md, docs/operations.md
# ─────────────────────────────────────────────────────────────────────────────

jenkins:
  systemMessage: "Jenkins Lab · managed by JCasC"
  numExecutors: 2
  mode: NORMAL
  labelString: "built-in"
  crumbIssuer: "standard"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "demo-api-token"
              secret: "${DEMO_API_TOKEN:-lab-api-token-change-me}"
              description: "Demo string secret consumed by secret-demo.Jenkinsfile"
          - usernamePassword:
              scope: GLOBAL
              id: "demo-basic-auth"
              username: "${DEMO_USER_ID:-demo}"
              password: "${DEMO_USER_PASSWORD:-demo-password}"
              description: "Demo username/password consumed by secret-demo.Jenkinsfile"

unclassified:
  location:
    url: "http://localhost:8090/"
    adminAddress: "admin@jenkins.lab"

jobs:
  - script: |
      pipelineJob('jcasc-demo') {
        description('Pipeline defined inline in jcasc/jenkins.yaml (Job DSL)')
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                  agent any
                  stages {
                      stage('Hello from JCasC') {
                          steps {
                              echo 'This pipeline was created by Job DSL embedded in JCasC.'
                          }
                      }
                      stage('Env') {
                          steps {
                              sh 'echo "Build #${BUILD_NUMBER} on ${NODE_NAME}"'
                          }
                      }
                  }
              }
            '''.stripIndent())
          }
        }
      }
